<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Arsene Kitemba">
  <meta name="description" content="Share your experience with a product: choose it, rate it, and tell us which features you found useful.">
  <title>Product Review Form</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Merriweather:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/shared.js" defer></script>
  <script src="scripts/form.js" defer></script>
</head>
<body>
  <header>
    <h1>Product Review</h1>
    <p>Tell us how your purchase is working out.</p>
  </header>

  <main>
    <div class="card">
      <h2>Write your review</h2>
      <p class="note">Fields marked with <span class="req">*</span> are required.</p>

      <form action="review.html" method="get">
        <div class="field">
          <label for="product">Product Name <span class="req">*</span></label>
          <select id="product" name="product" required>
            <option value="" disabled selected>Select a Product ...</option>
          </select>
        </div>

        <fieldset>
          <legend>Overall Rating <span class="req">*</span></legend>
          <div class="rating">
            <input type="radio" id="rating-1" name="rating" value="1" required>
            <label for="rating-1">1</label>
            <input type="radio" id="rating-2" name="rating" value="2" required>
            <label for="rating-2">2</label>
            <input type="radio" id="rating-3" name="rating" value="3" required>
            <label for="rating-3">3</label>
            <input type="radio" id="rating-4" name="rating" value="4" required>
            <label for="rating-4">4</label>
            <input type="radio" id="rating-5" name="rating" value="5" required>
            <label for="rating-5">5</label>
          </div>
        </fieldset>

        <div class="field">
          <label for="install-date">Date of Installation <span class="req">*</span></label>
          <input type="date" id="install-date" name="install-date" required>
        </div>

        <fieldset>
          <legend>Useful Features (check all that apply)</legend>
          <div class="checks">
            <div class="check">
              <input type="checkbox" id="feature-reliable" name="features" value="Reliable performance">
              <label for="feature-reliable">Reliable performance</label>
            </div>
            <div class="check">
              <input type="checkbox" id="feature-install" name="features" value="Easy to install">
              <label for="feature-install">Easy to install</label>
            </div>
            <div class="check">
              <input type="checkbox" id="feature-sturdy" name="features" value="Sturdy build">
              <label for="feature-sturdy">Sturdy build</label>
            </div>
            <div class="check">
              <input type="checkbox" id="feature-value" name="features" value="Good value">
              <label for="feature-value">Good value</label>
            </div>
            <div class="check">
              <input type="checkbox" id="feature-design" name="features" value="Great design">
              <label for="feature-design">Great design</label>
            </div>
          </div>
        </fieldset>

        <div class="field">
          <label for="written-review">Written Review (optional)</label>
          <textarea id="written-review" name="written-review" rows="5"></textarea>
        </div>

        <div class="field">
          <label for="user-name">Your Name (optional)</label>
          <input type="text" id="user-name" name="user-name" autocomplete="name">
        </div>

        <input type="submit" value="Submit Review">
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; <span id="year">2026</span> Arsene Kitemba</p>
    <p id="modified">Last Modification:</p>
  </footer>
</body>
</html>
