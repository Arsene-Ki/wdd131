<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Arsene Kitemba">
  <meta name="description" content="Confirmation of your submitted product review, with a count of the reviews you have completed.">
  <title>Review Confirmation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Merriweather:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/shared.js" defer></script>
  <script src="scripts/review.js" defer></script>
</head>
<body>
  <header>
    <h1>Product Review</h1>
    <p>Thank you for sharing your feedback.</p>
  </header>

  <main>
    <div class="card">
      <h2>Review received</h2>
      <p id="count-message"></p>
      <dl id="summary"></dl>
      <a class="back-link" href="form.html">Write another review</a>
    </div>
  </main>

  <footer>
    <p>&copy; <span id="year">2026</span> Arsene Kitemba</p>
    <p id="modified">Last Modification:</p>
  </footer>
</body>
</html>
